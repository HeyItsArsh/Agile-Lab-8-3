apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-department-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-department-portal
  template:
    metadata:
      labels:
        app: college-department-portal
    spec:
      containers:
      - name: college-department-portal
        image: heyitsarsh/college-department-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-department-service
spec:
  type: NodePort
  selector:
    app: college-department-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31150